---
layout: default
title: "V2X Fields & ROS Mapping"
description: "Bảng ánh xạ các trường V2X (CPM, CAM, DENM) sang ROS2 topics"
---

<!-- Toolbar -->
<div class="csv-toolbar">
  <div class="csv-toolbar__left">
    <span class="material-icons-outlined csv-toolbar__icon">table_chart</span>
    <span class="csv-toolbar__filename">v2x_fields_and_ros_mapping.csv</span>
    <span class="csv-toolbar__meta" id="csv-meta"></span>
  </div>
  <div class="csv-toolbar__right">
    <div class="csv-toolbar__search">
      <span class="material-icons-outlined">search</span>
      <input type="text" id="csv-search" placeholder="Tìm kiếm..." />
    </div>
    <a href="/v2x_fields_and_ros_mapping.csv" download class="csv-toolbar__btn csv-toolbar__btn--download">
      <span class="material-icons-outlined">download</span>
      Tải CSV
    </a>
  </div>
</div>

<!-- Legend -->
<div class="csv-legend">
  <span class="csv-tag csv-tag--exists">EXISTS</span> Bridge đã triển khai
  <span class="csv-tag csv-tag--nobridge">NO BRIDGE</span> Chưa có bridge
</div>

<!-- Table -->
<div class="csv-wrap" id="csv-table-wrap">
  <p class="csv-loading">Đang tải bảng...</p>
</div>

<script>
(function() {
  function parseCSV(text) {
    var rows = [], current = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQ = false; }
        else { field += c; }
      } else {
        if (c === '"') { inQ = true; }
        else if (c === ',') { current.push(field); field = ''; }
        else if (c === '\n' || (c === '\r' && text[i+1] === '\n')) {
          current.push(field); field = '';
          rows.push(current); current = [];
          if (c === '\r') i++;
        } else { field += c; }
      }
    }
    if (field || current.length) { current.push(field); rows.push(current); }
    return rows;
  }

  fetch('/v2x_fields_and_ros_mapping.csv')
    .then(function(r) { return r.text(); })
    .then(function(text) {
      var rows = parseCSV(text);
      if (!rows.length) return;

      var headers = rows[0];
      var dataRows = [];
      var rowNum = 0;
      for (var i = 1; i < rows.length; i++) {
        var row = rows[i];
        var empty = true;
        for (var e = 0; e < row.length; e++) { if (row[e].trim()) { empty = false; break; } }
        if (empty) { dataRows.push({ type: 'sep' }); continue; }
        rowNum++;
        dataRows.push({ type: 'data', num: rowNum, cells: row });
      }

      // Meta info
      var meta = document.getElementById('csv-meta');
      if (meta) meta.textContent = rowNum + ' rows \u00d7 ' + headers.length + ' cols';

      // Find status column
      var statusCol = -1;
      for (var s = 0; s < headers.length; s++) {
        if (headers[s].trim().toLowerCase().indexOf('bridge status') > -1) { statusCol = s; break; }
      }

      // Build table
      var html = '<table class="csv-table"><thead><tr><th class="csv-table__rownum">#</th>';
      for (var h = 0; h < headers.length; h++) {
        html += '<th>' + headers[h] + '</th>';
      }
      html += '</tr></thead><tbody>';

      for (var d = 0; d < dataRows.length; d++) {
        var dr = dataRows[d];
        if (dr.type === 'sep') {
          html += '<tr class="csv-table__sep"><td colspan="' + (headers.length + 1) + '"></td></tr>';
          continue;
        }
        var first = (dr.cells[0] || '').toUpperCase();
        var rowCls = first.indexOf('NO BRIDGE') > -1 ? ' csv-table__row--nobridge' :
                     first.indexOf('EXISTS') > -1 ? ' csv-table__row--exists' : '';
        html += '<tr class="csv-table__row' + rowCls + '">';
        html += '<td class="csv-table__rownum">' + dr.num + '</td>';
        for (var j = 0; j < headers.length; j++) {
          var cell = dr.cells[j] || '';
          if (j === statusCol && cell.trim()) {
            var v = cell.trim().toUpperCase();
            var cls = v === 'EXISTS' ? 'csv-tag--exists' : v === 'NO BRIDGE' ? 'csv-tag--nobridge' : '';
            html += '<td><span class="csv-tag ' + cls + '">' + cell.trim() + '</span></td>';
          } else {
            html += '<td>' + cell + '</td>';
          }
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('csv-table-wrap').innerHTML = html;

      // Search
      document.getElementById('csv-search').addEventListener('input', function() {
        var q = this.value.toLowerCase();
        var trs = document.querySelectorAll('.csv-table__row');
        for (var t = 0; t < trs.length; t++) {
          trs[t].style.display = !q || trs[t].textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
        }
      });
    })
    .catch(function() {
      document.getElementById('csv-table-wrap').innerHTML =
        '<p style="color:#c00;padding:40px;text-align:center">Lỗi tải file CSV.</p>';
    });
})();
</script>
